<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>PsychoVault Android Preview</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
  <aside id="rail" aria-label="Sidebar">
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="blocker" title="Ad blocker" aria-label="Ad blocker">⬡</button>
    <button class="rail-btn" id="proton" title="Proton VPN" aria-label="Proton VPN">⬟</button>
    <button class="rail-btn" id="settings" title="Settings" aria-label="Settings">⚙</button>
  </aside>
  <main id="main">
    <div id="tabstrip"><img id="logo" src="icon.png" alt=""><div id="tabs" role="tablist" aria-label="Open tabs"></div><button id="new-tab" aria-label="New tab">+</button></div>
    <div id="toolbar"><button id="back" aria-label="Back">‹</button><button id="forward" aria-label="Forward">›</button><button id="reload" aria-label="Reload">⟳</button><form id="address-form"><input id="address" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Address or search" placeholder="Search or enter address"><button type="submit" aria-label="Go">↵</button></form></div>
    <div id="vpn-warning" role="status">Experimental preview - Proton VPN and extensions do not work. Traffic is not protected by Proton.</div><div id="notice" role="status" hidden></div>
    <div id="page" aria-label="Website area"></div>
    <div id="status">Experimental Android preview</div>
  </main>
</div><script src="url.js"></script><script src="app.js"></script></body></html>
