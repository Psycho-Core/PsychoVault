<!doctype html><html><head><meta charset="utf-8"><title>Restore tabs - PsychoVault</title><style>body{font:15px/1.5 system-ui;background:#0a0e17;color:#e6edf7;padding:32px}main{max-width:850px;margin:auto}h1{color:#38bdf8}fieldset{border:1px solid #344966;border-radius:10px;margin:12px 0}label{display:block;padding:6px;overflow-wrap:anywhere}button{padding:10px 16px;background:#192438;color:white;border:1px solid #344966;border-radius:8px;cursor:pointer}.hint{color:#a8b6ca}</style></head><body><main><h1>Restore after an unexpected close</h1><p class="hint">Choose the tabs and windows to reopen. Private windows are not saved. A snapshot is taken every five seconds, so the latest changes may be missing.</p><div id="list"></div><button id="restore">Restore selected tabs</button><button id="skip">Start without restoring</button><p id="message" aria-live="polite"></p></main><script>
(async () => { const windows = await window.pv.recovery.list(); const box = document.getElementById('list'); windows.forEach((win, wi) => { const field = document.createElement('fieldset'); const legend = document.createElement('legend'); legend.textContent = 'Window ' + (wi + 1); field.append(legend); win.tabs.forEach((tab, ti) => { const label = document.createElement('label'); const input = document.createElement('input'); input.type = 'checkbox'; input.checked = true; input.dataset.window = wi; input.dataset.tab = ti; label.append(input, document.createTextNode(' ' + (tab.title || tab.url) + ' - ' + tab.url)); field.append(label) }); box.append(field) }); async function finish(selected) { const r = await window.pv.recovery.restore(selected); document.getElementById('message').textContent = r.ok ? 'Done. You can close this tab.' : 'Could not restore tabs.'; if (r.ok) { document.getElementById('restore').disabled = true; document.getElementById('skip').disabled = true } } document.getElementById('restore').onclick = () => { const selected = windows.map(() => []); for (const el of box.querySelectorAll('input:checked')) selected[Number(el.dataset.window)].push(Number(el.dataset.tab)); finish(selected) }; document.getElementById('skip').onclick = () => finish([]) })()
</script></body></html>
