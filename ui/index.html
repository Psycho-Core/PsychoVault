<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    /* Geometry measured from docs/reference/legacy-ui/03-new-tab-page.png at 1396x834. */
    .stage{position:relative;height:100vh;min-height:560px;background:radial-gradient(ellipse 430px 330px at 50% 36%, rgba(56,189,248,.12), rgba(56,189,248,0))}
    .stack{position:absolute;left:0;right:0;top:253px;text-align:center}
    .logo{display:block;margin:0 auto}
    .brand{margin-top:34px;height:40px;font-size:36px;line-height:40px;font-weight:700;color:var(--pv-text)}
    .search{display:block;width:620px;height:48px;margin:31px auto 0;padding:0 20px;border:1px solid var(--pv-accent);border-radius:var(--pv-radius-pill);background:var(--pv-surface);box-shadow:0 0 18px rgba(56,189,248,.25);color:var(--pv-text);font:14px/46px var(--pv-font)}
    .tiles{display:flex;justify-content:center;gap:14px;margin-top:26px}
    .tile{display:block;width:104px;height:104px;border:1px solid var(--pv-border);border-radius:14px;background:var(--pv-surface);text-align:center}
    .tile .ico{display:block;width:34px;height:34px;margin:21px auto 0;border-radius:17px;background:var(--pv-raised);color:var(--pv-accent);font-size:16px;line-height:34px;font-weight:700}
    .tile .lbl{display:block;margin-top:10px;font-size:12px;line-height:16px;color:var(--pv-muted)}
    .note-foot{position:absolute;left:0;right:0;bottom:21px;text-align:center;font-size:12px;color:var(--pv-faint)}
  </style>
</head>
<body>
  <div class="stage">
    <div class="stack">
      <svg class="logo" width="42" height="48" viewBox="0 0 42 48" aria-hidden="true">
        <path d="M21 2 L40 9 V24 C40 35 32 43 21 47 C10 43 2 35 2 24 V9 Z" fill="none" stroke="#38bdf8" stroke-width="2.4"/>
        <path d="M24 11 L13 27 H20 L17 39 L29 22 H22 Z" fill="#e6edf7"/>
      </svg>
      <h1 class="brand">PsychoVault</h1>
      <input id="address" class="search" type="text" name="address" value="" placeholder="Search DuckDuckGo or enter an address" aria-label="Search DuckDuckGo or enter an address">
      <div class="tiles">
        <a class="tile" href="https://github.com/"><span class="ico">G</span><span class="lbl">GitHub</span></a>
        <a class="tile" href="https://www.youtube.com/"><span class="ico">Y</span><span class="lbl">YouTube</span></a>
        <a class="tile" href="https://www.reddit.com/"><span class="ico">R</span><span class="lbl">Reddit</span></a>
        <a class="tile" href="https://www.wikipedia.org/"><span class="ico">W</span><span class="lbl">Wikipedia</span></a>
        <a class="tile" href="https://mail.google.com/"><span class="ico">M</span><span class="lbl">Mail</span></a>
        <a class="tile" href="https://news.google.com/"><span class="ico">N</span><span class="lbl">News</span></a>
      </div>
    </div>
    <div class="note-foot">Nothing leaves this machine unless you ask it to.</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
