name: Publish my Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty to use Psycho_VERSION.txt)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# I share the heavy-build group so I never run two Windows builds at once.
concurrency:
  group: psychovault-heavy
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve my version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content Psycho_VERSION.txt -Raw).Trim()
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
            else { $tag = "v$version" }
          }
          if ($tag -ne "v$version") {
            Write-Host "::error::Tag $tag does not match Psycho_VERSION.txt ($version). I refuse to publish a mislabelled build."
            exit 1
          }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "tag=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "I am publishing $tag"

      - name: Record toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python --version | Tee-Object build/toolchain.txt
          git rev-parse HEAD | Tee-Object -Append build/toolchain.txt

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Audit my source ownership
        shell: pwsh
        run: |
          python tools/Psycho_audit-source.py 2>&1 | Tee-Object build/audit-source.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit my file naming
        shell: pwsh
        run: |
          python tools/Psycho_audit_names.py 2>&1 | Tee-Object build/audit-names.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build browser, renderer and tests
        shell: pwsh
        run: |
          python tools/Psycho_build.py --compiler msvc --outdir build 2>&1 | Tee-Object build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run engine tests
        shell: pwsh
        run: |
          .\build\pv-tests.exe | Tee-Object build/engine-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render headless engine fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          .\build\pv-engine.exe --input tests/fixtures/Psycho_engine-smoke.html --out build/captures/headless-engine.png > build/headless-frame.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture native home window
        shell: pwsh
        run: |
          .\build\PsychoVault.exe --smoke --capture build/captures/native-home.png --profile build/test-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture native window rendering fetched pages
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory','tests/fixtures' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            .\build\PsychoVault.exe --smoke --url http://127.0.0.1:8765/Psycho_engine-smoke.html --capture build/captures/native-engine.png --profile build/test-profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\build\PsychoVault.exe --smoke --expect-image --url http://127.0.0.1:8765/Psycho_browser-smoke.html --capture build/captures/native-browser.png --profile build/test-profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

      - name: Run required AppContainer token, file and network sandbox gate
        shell: pwsh
        run: |
          .\build\PsychoVault.exe --sandbox-test --sandbox-report build/sandbox-test.json --profile build/test-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; d=json.load(open('build/sandbox-test.json', encoding='utf-8')); print(json.dumps(d, indent=2)); assert d.get('ok') is True"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## Required sandbox gate`n`n``````json" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content build/sandbox-test.json | Add-Content $env:GITHUB_STEP_SUMMARY
          "``````" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Prove my single executable renders with no sibling files
        shell: pwsh
        run: |
          # I copy ONLY PsychoVault.exe into an empty folder. If it cannot render
          # a fetched page from there, my one-file promise is broken.
          $solo = Join-Path $env:RUNNER_TEMP 'psychovault-solo'
          Remove-Item -Recurse -Force $solo -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $solo | Out-Null
          Copy-Item build/PsychoVault.exe $solo/PsychoVault.exe
          $count = (Get-ChildItem $solo -File).Count
          if ($count -ne 1) { throw "My solo folder has $count files, expected 1" }
          New-Item -ItemType Directory -Force build/captures | Out-Null
          $server = Start-Process python -ArgumentList '-m','http.server','8766','--directory','tests/fixtures' -PassThru -WindowStyle Hidden
          $render = 1
          $sandbox = 1
          try {
            Start-Sleep -Seconds 2
            # Start-Process -Wait waits for my whole process tree, and a contained
            # renderer can outlive the window. I bound the wait and read the exit
            # code of the browser itself.
            $p = Start-Process -FilePath "$solo/PsychoVault.exe" -ArgumentList '--smoke','--expect-image','--url','http://127.0.0.1:8766/Psycho_browser-smoke.html','--capture','build/captures/standalone.png','--profile','build/solo-profile' -PassThru
            if ($p.WaitForExit(60000)) { $render = $p.ExitCode } else { $render = 99; try { $p.Kill($true) } catch {} }
            $q = Start-Process -FilePath "$solo/PsychoVault.exe" -ArgumentList '--sandbox-test','--sandbox-report','build/solo-sandbox.json','--profile','build/solo-profile' -PassThru
            if ($q.WaitForExit(60000)) { $sandbox = $q.ExitCode } else { $sandbox = 99; try { $q.Kill($true) } catch {} }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          # I print my diagnostics before I decide, and I exit outside try/finally
          # so a finally block can never swallow my failure.
          # I publish my diagnostics to the job summary because I can read that
          # back through the API even when job logs and artifacts will not download.
          "## My single-file exe gate" | Add-Content $env:GITHUB_STEP_SUMMARY
          "render exit=$render sandbox exit=$sandbox" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/captures/standalone.png.failure.json) {
            Write-Host '--- my standalone render failure ---'
            Get-Content build/captures/standalone.png.failure.json | Tee-Object -FilePath build/standalone-failure.json
            Get-Content build/captures/standalone.png.failure.json | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            'no render failure report was written' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path build/solo-sandbox.json) {
            Write-Host '--- my standalone sandbox report ---'
            Get-Content build/solo-sandbox.json
            Get-Content build/solo-sandbox.json | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "standalone render exit=$render sandbox exit=$sandbox"
          # Job summaries are not readable through the API, but annotations are.
          # I publish my failure report as an annotation so I can diagnose without
          # downloading job logs or artifacts.
          if ($render -ne 0) {
            $detail = 'no failure report was written'
            if (Test-Path build/captures/standalone.png.failure.json) {
              $detail = (Get-Content build/captures/standalone.png.failure.json -Raw)
            }
            $detail = ($detail -replace "`r", '') -replace "`n", ' '
            Write-Host "::error::SOLO-DIAG exit=$render $detail"
          }
          if ($sandbox -ne 0 -and (Test-Path build/solo-sandbox.json)) {
            $sd = (Get-Content build/solo-sandbox.json -Raw)
            $sd = ($sd -replace "`r", '') -replace "`n", ' '
            Write-Host "::error::SOLO-SANDBOX exit=$sandbox $sd"
          }
          if ($render -ne 0) { Write-Host "::error::My standalone exe failed to render a fetched page (exit $render)"; exit 1 }
          if ($sandbox -ne 0) { Write-Host "::error::My standalone exe failed its sandbox gate (exit $sandbox)"; exit 1 }
          python -c "import json; d=json.load(open('build/solo-sandbox.json', encoding='utf-8')); assert d.get('ok') is True, d; print('My lone exe unpacked its renderer and passed containment.')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "## My single-file exe rendered on its own" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Package my release and update manifest
        shell: pwsh
        run: |
          python tools/Psycho_package.py --outdir build --commit $env:GITHUB_SHA --tag "${{ steps.version.outputs.tag }}" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify my packaged manifest before I publish
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib, zipfile
          out = pathlib.Path('build')
          manifest = json.loads((out / 'PsychoVault-update.json').read_text(encoding='utf-8'))
          assert manifest['product'] == 'PsychoVault'
          assert manifest['platform'] == 'windows-x64'
          for asset in manifest['assets']:
              path = out / asset['name']
              assert path.is_file(), f"missing {asset['name']}"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == asset['sha256'], f"hash mismatch for {asset['name']}"
              assert path.stat().st_size == asset['size']
          with zipfile.ZipFile(out / 'PsychoVault-windows-x64.zip') as z:
              names = set(z.namelist())
              for required in manifest['requires']:
                  assert required in names, f"ZIP is missing {required}"
              assert 'extensions/PsychoVault-VPN-Bridge/manifest.json' in names
              assert not any(n.startswith(('build/', '.git/')) or 'test-profile' in n for n in names)
          print('My manifest hashes and ZIP contents verified.')
          '@ | Set-Content -Encoding utf8 verify_package.py
          python verify_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write my release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @"
          # PsychoVault $version - Windows x64 development preview

          I build my own browser engine. This is a development preview I can test, not a finished browser.

          ## What I verified in this build

          - I built with MSVC on a GitHub-hosted Windows runner.
          - My engine test suite passed.
          - My renderer runs in a Windows AppContainer, and my required gate proved the token is active, a broker-owned file is unreadable, and direct TCP and UDP sockets are refused.
          - My single executable rendered a fetched page with images from an empty folder containing nothing else.
          - I rendered a fetched page with CSS, JavaScript and a decoded PNG through my sandboxed renderer.
          - My bundled VPN bridge drove my real proxy, storage and WebRTC-policy code, and my fail-closed routing refused to leak when no proxy was usable.
          - My download manager, PAC evaluator and extension permission checks passed their regression tests.

          ## How I run it

          I download **PsychoVault.exe** and double-click it. That is the whole install.

          My renderer is embedded inside that one file. I unpack it into my own Windows user folder and verify its hash before running it, so a single exe renders pages on its own. My CI proves this by copying only ``PsychoVault.exe`` into an empty folder and rendering a fetched page with images from there.

          I also publish ``PsychoVault-windows-x64.zip`` with my test tools for anyone who wants them, but I do not need it to browse.

          ## How my updater reads this release

          I publish ``PsychoVault-update.json`` with the version, tag and a SHA-256 for every asset. ``PsychoVault.exe`` is the update payload, so an update replaces one file. I verify the hash before I offer to install anything.

          ## What I am not claiming

          - YouTube and Netflix do not play. My engine has no media pipeline, no Media Source Extensions and no DRM. DRM will only ever arrive as a separately licensed extension, never inside my engine.
          - Proton VPN is not bundled. The included VPN bridge is my own code and needs a proxy I point it at.
          - My vault, password manager, translation, media keys and full legacy settings parity are not finished.
          - This build is unsigned, so Windows SmartScreen may warn me.

          ## No warranty

          I provide this preview as-is, without warranty.
          "@
          $notes | Set-Content -Encoding utf8 build/RELEASE-NOTES.md
          Get-Content build/RELEASE-NOTES.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Publish my release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $assets = @(
            'build/PsychoVault.exe',
            'build/pv-renderer.exe',
            'build/PsychoVault-windows-x64.zip',
            'build/PsychoVault-update.json',
            'build/package/SHA256SUMS.txt',
            'build/BUILD-INFO.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { Write-Host "::error::Missing release asset $asset"; exit 1 }
          }
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::Release $tag already exists. I do not overwrite a published release."
            exit 1
          }
          gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PsychoVault $tag - Windows x64 preview" --notes-file build/RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify my published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,assets | Tee-Object build/published-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; d=json.load(open('build/published-release.json', encoding='utf-8-sig')); names={a['name'] for a in d['assets']}; required={'PsychoVault.exe','pv-renderer.exe','PsychoVault-windows-x64.zip','PsychoVault-update.json','SHA256SUMS.txt'}; missing=required-names; assert not missing, missing; print('I verified my published release assets:', sorted(names))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## I published $tag" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Write my failure note
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          "I did not publish a release. This run failed for commit $env:GITHUB_SHA. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content build/FAILURE.txt
          if (Test-Path build/build.log) {
            $tail = Get-Content build/build.log -Tail 120
            "## Build failure tail`n`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($line in $tail) { if ($line -match 'error [A-Z]+[0-9]+|fatal error|build failed:') { Write-Host "::error::$line" } }
          }
          foreach ($file in @('build/audit-source.txt','build/audit-names.txt','build/engine-tests.txt','build/sandbox-test.json')) {
            if (Test-Path $file) {
              "## $file`n`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
              Get-Content $file -Tail 40 | Add-Content $env:GITHUB_STEP_SUMMARY
              "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psychovault-release-${{ github.sha }}
          path: |
            build/*.exe
            build/*.zip
            build/*.json
            build/*.txt
            build/*.md
            build/*.log
            build/package/SHA256SUMS.txt
            build/captures/*.png
          if-no-files-found: warn
          retention-days: 30
