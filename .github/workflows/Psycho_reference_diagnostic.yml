name: Reference diff Windows diagnostic
on:
  push:
    branches:
      - arena/9c1ade6a-psychovault
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: pwsh
        run: |
          python tests/Psycho_reference_diff_tests.py 2>&1 | Tee-Object reference-test.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $message = (Get-Content reference-test.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Reference diff tests::$message"
            exit $code
          }
