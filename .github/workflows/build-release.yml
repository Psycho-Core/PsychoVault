name: Build and publish Windows installer

on:
  push:
    branches:
      - Master
      - arena/bbe34741-psychovault
    paths:
      - 'app/**'
      - 'assets/psychovault.ico'
      - 'LICENSE'
      - 'README.md'
      - 'VERIFICATION.md'
      - 'installer.nsi'
      - 'tools/build-installer.sh'
      - 'tools/patch-exe.mjs'
      - 'tools/sign-update-manifest.mjs'
      - 'tools/generate-update-keypair.mjs'
      - 'tools/audit.mjs'
      - 'tools/*.test.cjs'
      - '.github/release.yml'
      - 'tools/package.json'
      - 'tools/package-lock.json'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
  schedule:
    # 11:00 Adelaide time on the 1st of every month. The Actions minute
    # allowance resets at 00:00 UTC on the 1st, which is 10:30 here during
    # daylight saving, so this deliberately fires half an hour after the reset:
    # a build that lands early would hit the quota block instead of building.
    # GitHub supports an IANA timezone here (since 19 March 2026), so this stays
    # 11:00 local through both ACDT and ACST rather than drifting an hour.
    - cron: '0 11 1 * *'
      timezone: 'Australia/Adelaide'

permissions:
  contents: write

# A scheduled build and a push-triggered build must not publish at the same time.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit source and test download, translation, and update flows
        run: |
          node tools/audit.mjs
          node --test tools/*.test.cjs

      - name: Read release version
        id: version
        run: echo "version=$(node -p 'require("./app/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Version already released::v$version already has a release. This run builds and keeps the artifact, but does not touch the release, its signature or SHA256SUMS.txt - bump the version in app/package.json to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether signed release publishing is configured
        id: signing-key
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if [ -n "$UPDATE_SIGNING_PRIVATE_KEY_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "A signed GitHub Release can be published after the installer build."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release not published::The installer will still be built, but no public GitHub Release will be created until UPDATE_SIGNING_PRIVATE_KEY_B64 is saved in repository Actions secrets."
          fi

      - name: Install NSIS and 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis p7zip-full unzip

      - name: Download the pinned Electron Windows runtime
        env:
          ELECTRON_SHA256: 55eaba17abff7b5bba6c3bbc85068967379024fe742fe9c7fdba9118922ccbe2
        run: |
          electron_version="$(node -p 'require("./app/package.json").devDependencies.electron')"
          archive="electron-v${electron_version}-win32-x64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/electron/electron/releases/download/v${electron_version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$ELECTRON_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p /var/tmp/payload
          unzip -q "$RUNNER_TEMP/$archive" -d /var/tmp/payload
          mv /var/tmp/payload/electron.exe /var/tmp/payload/PsychoVault.exe
          test -s /var/tmp/payload/PsychoVault.exe
          test -d /var/tmp/payload/locales

      - name: Install PE resource editor
        run: npm ci --prefix tools

      - name: Set PsychoVault icon and version on the runtime
        run: node tools/patch-exe.mjs /var/tmp/payload/PsychoVault.exe assets/psychovault.ico "${{ steps.version.outputs.version }}"

      - name: Inject the release read token
        env:
          # The repository secret is named PsychoVault_Updater; UPDATE_READ_TOKEN is kept as a
          # fallback so either name works and a rename cannot silently disable updates.
          UPDATE_READ_TOKEN: ${{ secrets.PsychoVault_Updater || secrets.UPDATE_READ_TOKEN }}
        run: |
          if [ -n "$UPDATE_READ_TOKEN" ]; then
            # Read-only credential for a private repository. Written into the staged app only:
            # the path is gitignored, and it never appears in the repository or the logs.
            node -e 'const fs=require("fs");fs.writeFileSync("app/update-token.json",JSON.stringify({token:process.env.UPDATE_READ_TOKEN})+"\n",{mode:0o600})'
            echo "A release read token was injected into this build ($(printf %s "$UPDATE_READ_TOKEN" | wc -c) bytes, from the PsychoVault_Updater secret)."
          else
            echo "::warning title=No release read token::Neither PsychoVault_Updater nor UPDATE_READ_TOKEN is set. The installer will build and install, but the in-app update check will get HTTP 404 from GitHub while the repository is private."
          fi

      - name: Build and verify the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAYLOAD: /var/tmp/payload
          OUT: ${{ github.workspace }}/PsychoVault-Setup-${{ steps.version.outputs.version }}.exe
        run: bash tools/build-installer.sh

      - name: Upload unsigned installer artifact for testing
        id: unsigned-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PsychoVault-Setup-${{ steps.version.outputs.version }}-unsigned
          path: PsychoVault-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Report when Actions storage prevents artifact retention
        if: steps.unsigned-artifact.outcome == 'failure'
        run: echo "::warning title=Build succeeded; artifact unavailable::The installer was built, but GitHub Actions could not retain a downloadable artifact. Free Actions artifact storage quota if you need the temporary installer file."

      - name: Sign update manifest
        if: steps.signing-key.outputs.configured == 'true' && steps.released.outputs.exists == 'false'
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/sign-update-manifest.mjs "PsychoVault-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Write checksum
        if: steps.signing-key.outputs.configured == 'true' && steps.released.outputs.exists == 'false'
        run: sha256sum "PsychoVault-Setup-${{ steps.version.outputs.version }}.exe" > SHA256SUMS.txt

      - name: Update the branch checksum
        if: steps.signing-key.outputs.configured == 'true' && steps.released.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "The branch checksum is already current."
          else
            git commit -m "chore: update installer checksum for v${{ steps.version.outputs.version }}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Publish the signed release
        if: steps.signing-key.outputs.configured == 'true' && steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "PsychoVault-Setup-${{ steps.version.outputs.version }}.exe" \
            SHA256SUMS.txt \
            update-manifest.json \
            update-manifest.sig \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "PsychoVault ${{ steps.version.outputs.version }}" \
            --notes "Download the Windows x64 installer below. SHA256SUMS.txt is a checksum for manual checks; the updater authenticates update-manifest.json with the detached Ed25519 signature update-manifest.sig before trusting the installer hash. Generated notes list the changes included in this release." \
            --generate-notes \
            --latest
