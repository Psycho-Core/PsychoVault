name: Android build segment

# One resumable hosted compile segment. The caller decides how many segments to
# run; each segment stops before the six-hour hosted-job limit and checkpoints
# the engine workspace when Ninja is not finished.
on:
  workflow_call:
    inputs:
      segment:
        required: true
        type: number
      resume_artifact:
        required: false
        type: string
        default: ''
    outputs:
      status:
        description: completed, checkpoint, or failed
        value: ${{ jobs.build.outputs.status }}
      checkpoint_artifact:
        description: workspace artifact to resume in the next segment
        value: ${{ jobs.build.outputs.checkpoint_artifact }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.ANDROID_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    outputs:
      status: ${{ steps.status.outputs.status }}
      checkpoint_artifact: ${{ steps.checkpoint-name.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Free hosted-runner disk and choose engine workspace
        id: paths
        shell: bash
        run: |
          set -Eeuo pipefail
          notes="$RUNNER_TEMP/psychovault-build-notes"
          mkdir -p "$notes"
          echo "notes_dir=$notes" >> "$GITHUB_OUTPUT"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y zstd
          # Keep the same absolute path in every segment so GN/Ninja state and
          # sccache path normalization remain valid on disposable runners.
          parent=/mnt
          sudo mkdir -p "$parent"
          sudo chown "$(id -un):$(id -gn)" "$parent"
          engine="$parent/psychovault-engine"
          if [[ -e "$engine" || -L "$engine" ]]; then
            echo "Engine workspace already exists; refusing to overwrite: $engine" >&2
            exit 1
          fi
          echo "engine_root=$engine" >> "$GITHUB_OUTPUT"
          echo "engine_parent=$parent" >> "$GITHUB_OUTPUT"
          free_gb=$(df -BG --output=avail "$parent" | tail -1 | tr -dc '0-9')
          df -h "$parent" "$RUNNER_TEMP" | tee "$notes/disk.txt"
          {
            echo "PsychoVault Android build notes"
            echo "Status: APK build segment ${{ inputs.segment }} attempted"
            echo "Runner free disk: ${free_gb}GB"
            echo "Engine workspace: $engine"
            echo "Compiler cache: sccache via GitHub Actions cache"
          } > "$notes/Release-Notes-Android.txt"
          if [[ "$free_gb" -lt 60 ]]; then
            echo "This runner has less than 60GB free after cleanup. No APK was produced." >> "$notes/Release-Notes-Android.txt"
            exit 1
          fi
      - name: Download previous engine checkpoint
        if: inputs.resume_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.resume_artifact }}
          path: ${{ runner.temp }}/engine-checkpoint-download
      - name: Restore previous engine checkpoint
        if: inputs.resume_artifact != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          download="$RUNNER_TEMP/engine-checkpoint-download"
          parent="${{ steps.paths.outputs.engine_parent }}"
          engine="${{ steps.paths.outputs.engine_root }}"
          cd "$download"
          sha256sum -c SHA256SUMS
          mkdir -p "$parent"
          if [[ -e "$engine" || -L "$engine" ]]; then
            echo "Engine workspace appeared before restore; refusing to overwrite: $engine" >&2
            exit 1
          fi
          cat engine.tar.zst.part-* | zstd -d | tar -C "$parent" -xf -
          [[ -d "$engine" && -f "$engine/.psychovault-engine-ready" ]] || {
            echo "Restored checkpoint is missing the prepared-engine marker." >&2
            exit 1
          }
          rm -rf "$download"
      - name: Prepare pinned engine workspace
        if: inputs.resume_artifact == ''
        shell: bash
        run: |
          set -Eeuo pipefail
          notes="${{ steps.paths.outputs.notes_dir }}"
          if ! bash android-port/scripts/prepare-engine.sh "${{ steps.paths.outputs.engine_root }}" 2>&1 | tee "$notes/prepare.log"; then
            msg="$(tail -n 25 "$notes/prepare.log" | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error::prepare-engine failed: $msg"
            exit 1
          fi
      - name: Build and validate APK
        id: build
        env:
          PSYCHO_NOTES_DIR: ${{ steps.paths.outputs.notes_dir }}
          PSYCHO_BUILD_STATUS_FILE: ${{ steps.paths.outputs.notes_dir }}/build-status.txt
          PSYCHO_RESUME_ENGINE: ${{ inputs.resume_artifact == '' && '0' || '1' }}
          PSYCHO_MAX_BUILD_MINUTES: '240'
          PSYCHO_CC_WRAPPER: sccache
          PSYCHO_BUILD_JOBS: ${{ vars.ANDROID_BUILD_JOBS }}
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: android-arm64-v1
          SCCACHE_IDLE_TIMEOUT: "0"
          SCCACHE_BASEDIRS: ${{ steps.paths.outputs.engine_root }}/chromium/src
          SCCACHE_ERROR_LOG: ${{ steps.paths.outputs.notes_dir }}/sccache-error.log
        shell: bash
        run: |
          set -Eeuo pipefail
          notes="${{ steps.paths.outputs.notes_dir }}"
          if ! bash "${{ steps.paths.outputs.engine_root }}/build-engine.sh"; then
            msg="$(tail -n 35 "$notes/build.log" | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error::build-engine failed: $msg"
            exit 1
          fi
      - name: Read build status
        id: status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          status_file="${{ steps.paths.outputs.notes_dir }}/build-status.txt"
          status=failed
          if [[ -f "$status_file" ]]; then
            status="$(tr -d '[:space:]' < "$status_file")"
          fi
          case "$status" in
            completed|checkpoint|failed) ;;
            *) status=failed ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Build segment ${{ inputs.segment }} status: $status"
      - name: Upload APK and release inputs
        if: steps.status.outputs.status == 'completed'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ${{ steps.paths.outputs.engine_root }}/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Pack engine checkpoint
        id: checkpoint-pack
        if: steps.status.outputs.status == 'checkpoint'
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="${{ steps.paths.outputs.engine_parent }}"
          engine="${{ steps.paths.outputs.engine_root }}"
          checkpoint="$parent/psychovault-checkpoint-${{ inputs.segment }}"
          if [[ -e "$checkpoint" || -L "$checkpoint" ]]; then
            echo "Checkpoint directory already exists; refusing to overwrite: $checkpoint" >&2
            exit 1
          fi
          mkdir -p "$checkpoint"
          # tar preserves executable bits, symlinks and hidden files; zstd -1
          # favors checkpoint speed over maximum compression.
          tar -C "$parent" -cf - "$(basename "$engine")" \
            | zstd -T0 -1 \
            | split -b 8G -d -a 3 - "$checkpoint/engine.tar.zst.part-"
          (cd "$checkpoint" && sha256sum engine.tar.zst.part-* > SHA256SUMS)
          du -sh "$checkpoint" | tee -a "${{ steps.paths.outputs.notes_dir }}/disk.txt"
          echo "checkpoint_dir=$checkpoint" >> "$GITHUB_OUTPUT"
      - name: Upload engine checkpoint
        id: checkpoint-upload
        if: steps.status.outputs.status == 'checkpoint'
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-checkpoint-${{ inputs.segment }}
          path: ${{ steps.checkpoint-pack.outputs.checkpoint_dir }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record checkpoint artifact name
        if: steps.status.outputs.status == 'checkpoint'
        shell: bash
        run: echo "artifact-name=android-engine-checkpoint-${{ inputs.segment }}" >> "$GITHUB_OUTPUT"
        id: checkpoint-name
      - name: Upload build notes and failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-notes-segment-${{ inputs.segment }}
          path: ${{ steps.paths.outputs.notes_dir }}/
          if-no-files-found: warn
          retention-days: 14
