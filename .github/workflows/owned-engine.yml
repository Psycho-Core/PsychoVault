name: Build owned engine

on:
  workflow_dispatch:
  pull_request:
    branches: [Master]
    paths:
      - 'engine/**'
      - 'platform/**'
      - 'shell/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/TEST-BUILD.md'
      - 'NOTICE.txt'
      - '.github/workflows/owned-engine.yml'
  push:
    branches: [Master]
    paths:
      - 'engine/**'
      - 'platform/**'
      - 'shell/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/TEST-BUILD.md'
      - 'NOTICE.txt'
      - '.github/workflows/owned-engine.yml'

permissions:
  contents: read

concurrency:
  group: psychovault-heavy
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 owned engine
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python --version | Tee-Object build/toolchain.txt
          git rev-parse HEAD | Tee-Object -Append build/toolchain.txt
      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build browser, renderer and tests
        shell: pwsh
        run: |
          python tools/build.py --compiler msvc --outdir build 2>&1 | Tee-Object build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run engine tests
        shell: pwsh
        run: |
          .\build\pv-tests.exe | Tee-Object build/engine-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render headless engine fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          .\build\pv-engine.exe --input tests/fixtures/engine-smoke.html --out build/captures/headless-engine.png > build/headless-frame.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture native home window
        shell: pwsh
        run: |
          .\build\PsychoVault.exe --smoke --capture build/captures/native-home.png --profile build/test-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture native window rendering a fetched page
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory','tests/fixtures' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            .\build\PsychoVault.exe --smoke --url http://127.0.0.1:8765/engine-smoke.html --capture build/captures/native-engine.png --profile build/test-profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\build\PsychoVault.exe --smoke --expect-image --url http://127.0.0.1:8765/browser-smoke.html --capture build/captures/native-browser.png --profile build/test-profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Run required AppContainer token, file and network sandbox test
        id: sandbox
        shell: pwsh
        run: |
          .\build\pv-sandbox-test.exe 2>&1 | Tee-Object build/sandbox-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows preview ZIP
        shell: pwsh
        run: |
          python tools/package.py --outdir build --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write failure note
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          "I did not publish a release. This build failed for commit $env:GITHUB_SHA. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content build/FAILURE.txt
          if (Test-Path build/sandbox-test.txt) {
            $sandbox = Get-Content build/sandbox-test.txt -Tail 40
            "## Sandbox test output`n`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            $sandbox | Add-Content $env:GITHUB_STEP_SUMMARY
            "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($line in $sandbox) { Write-Host "::error::$line" }
          }
          if (Test-Path build/build.log) {
            $tail = Get-Content build/build.log -Tail 120
            $tail | Set-Content build/build-tail.txt
            "## Build failure tail`n`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($line in $tail) { if ($line -match 'error [A-Z]+[0-9]+|warning [A-Z]+[0-9]+|fatal error|build failed:') { Write-Host "::error::$line" } }
          }
      - name: Upload development build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psychovault-development-${{ github.sha }}
          path: |
            build/*.exe
            build/*.zip
            build/*.txt
            build/*.json
            build/*.log
            build/captures/*.png
          if-no-files-found: warn
          retention-days: 14
