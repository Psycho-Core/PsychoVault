name: Android source and build

# Keep the push trigger on the active development branch so an authorized build can start from a push.
# Use [skip ci] for docs-only pushes while an APK build is running.
on:
  workflow_dispatch:
  push:
    branches: [arena/882adae6-psychovault]
    paths:
      - 'android-port/**'
      - 'app/ui/**'
      - 'app/builtin/**'
      - 'app/blocklist.json'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-build-segment.yml'

permissions:
  contents: read

concurrency:
  group: psychovault-android-build
  # Protect running APK builds by default. An explicitly authorized restart can
  # include [restart build] in the push commit message to replace the old run.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message || '', '[restart build]') }}

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Desktop audit and tests
        run: |
          node tools/audit.mjs
          node --test tools/*.test.cjs
      - name: Android source tests
        run: |
          node --test android-port/test/*.test.cjs
          python3 -m unittest discover -s android-port/test -p '*_test.py'
          node android-port/scripts/audit-android-source.cjs
      - name: Generate UI and bundled extension assets
        run: |
          node android-port/scripts/prepare-ui.cjs "$RUNNER_TEMP/psychovault-ui"
          python3 android-port/engine/psychovault/prepare_bundled_extensions.py
      - name: Java syntax parse
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/py" javalang
          PYTHONPATH="$RUNNER_TEMP/py" python3 - <<'PY'
          import glob, javalang
          for path in glob.glob('android-port/engine/psychovault/java/**/*.java', recursive=True):
              javalang.parse.parse(open(path, encoding='utf-8').read())
              print('parsed', path)
          PY
      - name: Write source notes
        run: |
          mkdir -p build-notes
          {
            echo "PsychoVault Android source notes"
            echo "Status: source checks passed"
            echo "The APK build is a separate job. Source checks alone do not produce an APK."
            echo "Chromium compile, device, extension and VPN behaviour tests are still required."
          } > build-notes/Release-Notes-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-source-notes
          path: build-notes/Release-Notes-Android.txt
          retention-days: 7

  # A free hosted job is limited to six hours. Each segment compiles for at most
  # 240 minutes, then checkpoints the workspace so the next segment can resume
  # Ninja instead of throwing the cold build away. This does not make a cold
  # compile faster; it makes a multi-hour compile survivable on free runners.
  segment-1:
    needs: source-checks
    uses: ./.github/workflows/android-build-segment.yml
    with:
      segment: 1
  segment-2:
    needs: segment-1
    if: always() && needs.segment-1.outputs.status == 'checkpoint'
    uses: ./.github/workflows/android-build-segment.yml
    with:
      segment: 2
      resume_artifact: ${{ needs.segment-1.outputs.checkpoint_artifact }}
  segment-3:
    needs: segment-2
    if: always() && needs.segment-2.outputs.status == 'checkpoint'
    uses: ./.github/workflows/android-build-segment.yml
    with:
      segment: 3
      resume_artifact: ${{ needs.segment-2.outputs.checkpoint_artifact }}
  segment-4:
    needs: segment-3
    if: always() && needs.segment-3.outputs.status == 'checkpoint'
    uses: ./.github/workflows/android-build-segment.yml
    with:
      segment: 4
      resume_artifact: ${{ needs.segment-3.outputs.checkpoint_artifact }}

  publish-release:
    needs: [segment-1, segment-2, segment-3, segment-4]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require a completed APK segment
        shell: bash
        run: |
          set -Eeuo pipefail
          status1="${{ needs.segment-1.outputs.status }}"
          status2="${{ needs.segment-2.outputs.status }}"
          status3="${{ needs.segment-3.outputs.status }}"
          status4="${{ needs.segment-4.outputs.status }}"
          echo "Segment statuses: $status1 $status2 $status3 $status4"
          if [[ "$status1" == completed || "$status2" == completed || "$status3" == completed || "$status4" == completed ]]; then
            exit 0
          fi
          echo "::error::No Android build segment completed an APK. Check the segment notes and failure logs."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - name: Verify downloaded APK before publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, pathlib, zipfile
          meta = json.loads(pathlib.Path('build-metadata.json').read_text())
          apk = pathlib.Path(meta['apk'])
          if not apk.is_file() or apk.stat().st_size != meta['bytes']:
              raise SystemExit('APK metadata mismatch')
          with zipfile.ZipFile(apk) as z:
              if z.testzip():
                  raise SystemExit('Corrupt APK')
          print(f"Verified {apk} ({apk.stat().st_size} bytes)")
          PY
      - name: Publish prerelease to Releases
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="android-chromium-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="PsychoVault Android Chromium preview $(python3 -c "import json; print(json.load(open('dist/build-metadata.json'))['chromiumVersion'])")"
          gh release create "$tag" \
            dist/*.apk \
            dist/Release-Notes-Android.txt \
            dist/build-metadata.json \
            dist/SHA256SUMS \
            dist/engine-source-manifest.txt \
            dist/apksigner.txt \
            dist/apk-badging.txt \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file dist/Release-Notes-Android.txt \
            --prerelease
