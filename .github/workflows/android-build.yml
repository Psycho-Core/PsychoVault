name: Android source and build

on:
  workflow_dispatch:
  push:
    branches: [arena/4770266d-psychovault]
    paths:
      - 'android-port/**'
      - 'app/ui/**'
      - 'app/builtin/**'
      - 'app/blocklist.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Desktop audit and tests
        run: |
          node tools/audit.mjs
          node --test tools/*.test.cjs
      - name: Android source tests
        run: |
          node --test android-port/test/*.test.cjs
          python3 -m unittest discover -s android-port/test -p '*_test.py'
          node android-port/scripts/audit-android-source.cjs
      - name: Generate UI and bundled extension assets
        run: |
          node android-port/scripts/prepare-ui.cjs "$RUNNER_TEMP/psychovault-ui"
          python3 android-port/engine/psychovault/prepare_bundled_extensions.py
      - name: Java syntax parse
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/py" javalang
          PYTHONPATH="$RUNNER_TEMP/py" python3 - <<'PY'
          import glob, javalang
          for path in glob.glob('android-port/engine/psychovault/java/**/*.java', recursive=True):
              javalang.parse.parse(open(path, encoding='utf-8').read())
              print('parsed', path)
          PY
      - name: Write source notes
        run: |
          mkdir -p build-notes
          {
            echo "PsychoVault Android source notes"
            echo "Status: source checks passed"
            echo "The APK build is a separate job. Source checks alone do not produce an APK."
            echo "Chromium compile, device, extension and VPN behaviour tests are still required."
          } > build-notes/Release-Notes-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-source-notes
          path: build-notes/Release-Notes-Android.txt
          retention-days: 7

  build-apk:
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Free hosted-runner disk and choose engine workspace
        id: paths
        shell: bash
        run: |
          set -Eeuo pipefail
          notes="$RUNNER_TEMP/psychovault-build-notes"
          mkdir -p "$notes"
          echo "notes_dir=$notes" >> "$GITHUB_OUTPUT"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo docker system prune -af || true
          parent=/mnt
          if [[ ! -w "$parent" ]]; then parent="$RUNNER_TEMP"; fi
          engine="$parent/psychovault-engine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "engine_root=$engine" >> "$GITHUB_OUTPUT"
          free_gb=$(df -BG --output=avail "$parent" | tail -1 | tr -dc '0-9')
          df -h "$parent" "$RUNNER_TEMP" | tee "$notes/disk.txt"
          {
            echo "PsychoVault Android build notes"
            echo "Status: APK build attempted"
            echo "Runner free disk: ${free_gb}GB"
            echo "Engine workspace: $engine"
          } > "$notes/Release-Notes-Android.txt"
          # A single arm64, no-PGO/no-ThinLTO, symbol-stripped build is smaller
          # than the upstream dual-arch/AAB build. Fail early if even that cannot fit.
          if [[ "$free_gb" -lt 60 ]]; then
            echo "This runner has less than 60GB free after cleanup. No APK was produced." >> "$notes/Release-Notes-Android.txt"
            exit 1
          fi
      - name: Prepare pinned engine workspace
        run: bash android-port/scripts/prepare-engine.sh "${{ steps.paths.outputs.engine_root }}"
      - name: Build and validate APK
        env:
          PSYCHO_NOTES_DIR: ${{ steps.paths.outputs.notes_dir }}
        run: bash "${{ steps.paths.outputs.engine_root }}/build-engine.sh"
      - name: Upload APK and release inputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ${{ steps.paths.outputs.engine_root }}/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build notes and failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-notes
          path: ${{ steps.paths.outputs.notes_dir }}/
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - name: Verify downloaded APK before publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, pathlib, zipfile
          meta = json.loads(pathlib.Path('build-metadata.json').read_text())
          apk = pathlib.Path(meta['apk'])
          if not apk.is_file() or apk.stat().st_size != meta['bytes']:
              raise SystemExit('APK metadata mismatch')
          with zipfile.ZipFile(apk) as z:
              if z.testzip():
                  raise SystemExit('Corrupt APK')
          print(f"Verified {apk} ({apk.stat().st_size} bytes)")
          PY
      - name: Publish prerelease to Releases
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="android-chromium-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="PsychoVault Android Chromium preview $(python3 -c "import json; print(json.load(open('dist/build-metadata.json'))['chromiumVersion'])")"
          gh release create "$tag" \
            dist/*.apk \
            dist/Release-Notes-Android.txt \
            dist/build-metadata.json \
            dist/SHA256SUMS \
            dist/engine-source-manifest.txt \
            dist/apksigner.txt \
            dist/apk-badging.txt \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file dist/Release-Notes-Android.txt \
            --prerelease
