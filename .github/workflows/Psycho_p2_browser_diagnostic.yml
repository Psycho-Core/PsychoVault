name: Phase 2 independent browser diagnostic
on:
  push:
    branches: [arena/738b504f-psychovault]
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect reference contract in Chromium
        shell: pwsh
        run: |
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (!(Test-Path $chrome)) { throw 'Chrome not found' }
          $fixture = Get-Content tests/fixtures/p2/flex-grid.html -Raw
          $probe = @'
          <script>
          const selectors=['.flex-row','.card:nth-child(1)','.card:nth-child(2)','.card:nth-child(3)','.grid','.grid > div:nth-child(1)','.grid > div:nth-child(2)','.grid > div:nth-child(3)','.grid > div:nth-child(4)','.grid > div:nth-child(5)'];
          let results = {};
          for(const selector of selectors){let e=document.querySelector(selector); let r=e.getBoundingClientRect(); results[selector]={x:r.x,y:r.y,w:r.width,h:r.height};}
          document.body.textContent=JSON.stringify({viewport:[innerWidth,innerHeight],boxes:results});
          </script>
          '@
          $fixture = $fixture.Replace('</body>', $probe + '</body>')
          $file = Join-Path $env:RUNNER_TEMP 'p2-browser-probe.html'
          [System.IO.File]::WriteAllText($file, $fixture, [System.Text.UTF8Encoding]::new($false))
          $url = ([System.Uri]::new($file)).AbsoluteUri
          $profile = Join-Path $env:RUNNER_TEMP 'p2-browser-profile'
          $lines = & $chrome --headless --disable-gpu --no-sandbox --window-size=1396,1000 --user-data-dir=$profile --dump-dom $url 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Chrome exited $LASTEXITCODE" }
          $out = $lines -join ''
          if ($out -notmatch '<body>(\{.*\})</body>') { throw "Unexpected browser output: $out" }
          $json = $Matches[1] -replace '&quot;', '"' -replace '&amp;', '&'
          $version = & $chrome --version
          Write-Host "::notice title=Reference browser::$version $json"
