name: Capture legacy UI screenshots

on:
  push:
    branches: [arena/9fe5182a-psychovault]
    paths:
      - '.github/workflows/legacy-screenshots.yml'
      - 'tools/capture-legacy-screenshots.cjs'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Electron and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          npm install --prefix app --no-audit --no-fund
      - name: Capture current browser UI
        id: capture
        continue-on-error: true
        run: |
          mkdir -p screenshots/legacy
          xvfb-run -a -s "-screen 0 1600x1000x24" app/node_modules/.bin/electron --no-sandbox tools/capture-legacy-screenshots.cjs > screenshots/legacy/capture-log.txt 2>&1
          cat screenshots/legacy/capture-log.txt
      - name: Save screenshots and log to the working branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/legacy
          if git diff --cached --quiet; then
            echo "No screenshot files to save."
          else
            git commit -m "Save legacy UI screenshots [skip ci]"
            git push origin HEAD:arena/9fe5182a-psychovault
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychovault-legacy-screenshots
          path: screenshots/legacy
          if-no-files-found: error
          retention-days: 30
      - name: Fail if capture failed
        if: steps.capture.outcome != 'success'
        run: exit 1
