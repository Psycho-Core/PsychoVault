name: Capture legacy UI screenshots

on:
  push:
    branches: [arena/9fe5182a-psychovault]
    paths:
      - '.github/workflows/legacy-screenshots.yml'
      - 'tools/capture-legacy-screenshots.cjs'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Electron and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          npm install --prefix app --no-audit --no-fund
      - name: Capture current browser UI
        run: xvfb-run -a app/node_modules/.bin/electron --no-sandbox tools/capture-legacy-screenshots.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychovault-legacy-screenshots
          path: screenshots/legacy
          if-no-files-found: error
          retention-days: 30
