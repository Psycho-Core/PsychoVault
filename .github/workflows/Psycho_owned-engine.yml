name: Build owned engine

# PARKED on purpose (P0/S003). No push, tag or pull-request trigger may start a
# build until the runtime milestone is real. Run this workflow by hand when the
# gates in docs/Psycho_MASTER-PLAN.md say an output is worth building; see
# docs/Psycho_BUILD-AND-RELEASE.md.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: psychovault-heavy
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 owned engine
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python --version | Tee-Object build/toolchain.txt
          git rev-parse HEAD | Tee-Object -Append build/toolchain.txt
      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build my browser and tests
        shell: pwsh
        run: |
          python tools/Psycho_build.py --compiler msvc --outdir build 2>&1 | Tee-Object build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run engine tests
        shell: pwsh
        env:
          # My tests print the line of each check they start, so a process that dies
          # on this runner still leaves the check it died in at the end of the log.
          PV_PROGRESS: 1
        run: |
          # Both streams go into the file, because my checks report a failure on
          # stderr and I want that line to survive into the log and the annotation.
          .\build\pv-tests.exe 2>&1 | Tee-Object build/engine-tests.txt
          $code = $LASTEXITCODE
          "exit code: $code" | Tee-Object -Append build/engine-tests.txt
          if ($code -ne 0) { exit $code }
      - name: Run rendering golden suite
        shell: pwsh
        run: |
          python tests/Psycho_golden_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/Psycho_reference_diff_tests.py 2>&1 | Tee-Object build/reference-diff-tests.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            foreach ($line in (Get-Content build/reference-diff-tests.txt)) { Write-Host "::error title=Reference diff tests::$line" }
            exit $code
          }
          python tools/Psycho_golden.py --engine build/pv-engine.exe --outdir build/golden-results
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path build/golden-results/report.json)) {
            $report = Get-Content build/golden-results/report.json -Raw | ConvertFrom-Json
            foreach ($item in $report.cases) {
              if ($item.result -eq 'failed') { Write-Host "::error title=Golden $($item.id)::$($item.error)" }
            }
          }
          if ($code -ne 0) { exit $code }
      - name: Run hand-specified rendering goldens
        shell: pwsh
        run: |
          python tests/Psycho_independent_golden_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/Psycho_independent_goldens.py --engine build/pv-engine.exe --outdir build/independent-golden-results
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path build/independent-golden-results/report.json)) {
            $report = Get-Content build/independent-golden-results/report.json -Raw | ConvertFrom-Json
            foreach ($item in $report.cases) {
              if ($item.result -eq 'failed') { Write-Host "::error title=Independent golden $($item.id)::$($item.error)" }
            }
          }
          if ($code -ne 0) { exit $code }
      - name: Verify reference-derived image contract
        shell: pwsh
        run: |
          python tests/Psycho_p2_contract_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-image-contract.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-image-contract.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 image contract::$detail"
            exit $code
          }
      - name: Verify responsive image contract
        shell: pwsh
        run: |
          python tests/Psycho_p2_responsive_image_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-responsive-image.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-responsive-image.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 responsive image contract::$detail"
            exit $code
          }
      - name: Verify default control painting contract
        shell: pwsh
        run: |
          python tests/Psycho_p2_controls_contract_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-controls.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-controls.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 controls contract::$detail"
            exit $code
          }
      - name: Verify layout geometry contract
        shell: pwsh
        run: |
          python tests/Psycho_p2_layout_contract_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-layout.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-layout.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 layout contract::$detail"
            exit $code
          }
      - name: Verify gradient paint contract
        shell: pwsh
        run: |
          python tests/Psycho_p2_paint_contract_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-paint.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-paint.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 paint contract::$detail"
            exit $code
          }
      - name: Verify focus interaction contract
        shell: pwsh
        run: |
          python tests/Psycho_p2_focus_contract_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-focus-contract.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-focus-contract.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 focus contract::$detail"
            exit $code
          }
      - name: Verify reference-derived DOM and layout contracts
        shell: pwsh
        run: |
          python tests/Psycho_p2_dom_layout_contract_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/p2-dom-layout-contract.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content build/p2-dom-layout-contract.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=P2 DOM and layout contract::$detail"
            exit $code
          }
      - name: Publish my failing check
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build/engine-tests.txt) {
            $lines = Get-Content build/engine-tests.txt | Select-Object -Last 5
            foreach ($line in $lines) { Write-Host "::error::$line" }
          }
      - name: Render headless engine fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          .\build\pv-engine.exe --input tests/fixtures/Psycho_engine-smoke.html --out build/captures/headless-engine.png > build/headless-frame.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture native home window
        shell: pwsh
        run: |
          .\build\PsychoVault.exe --smoke --capture build/captures/native-home.png --profile build/test-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture native window rendering a fetched page
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory','tests/fixtures' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            .\build\PsychoVault.exe --smoke --url http://127.0.0.1:8765/Psycho_engine-smoke.html --capture build/captures/native-engine.png --profile build/test-profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\build\PsychoVault.exe --smoke --expect-image --url http://127.0.0.1:8765/Psycho_browser-smoke.html --capture build/captures/native-browser.png --profile build/test-profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Capture my engine-rendered pages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          $hashes = @{}
          foreach ($page in 'version', 'nettest', 'newtab', 'settings') {
            $out = Join-Path $env:GITHUB_WORKSPACE "build/captures/page-$page.png"
            Remove-Item -Force $out -ErrorAction SilentlyContinue
            # The browser is a GUI-subsystem program, so PowerShell would not wait
            # for it; start it explicitly and wait for its real exit code.
            $p = Start-Process -FilePath '.\build\PsychoVault.exe' -ArgumentList @('--smoke', '--url', "psychovault://$page", '--capture', $out, '--profile', 'build/test-profile') -PassThru
            if (-not $p.WaitForExit(90000)) { try { $p.Kill($true) } catch {}; throw "psychovault://$page did not finish" }
            if ($p.ExitCode -ne 0) { throw "psychovault://$page exited $($p.ExitCode)" }
            if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 2000) { throw "no usable capture for psychovault://$page" }
            $hashes[$page] = (Get-FileHash $out).Hash
            Write-Host "psychovault://$page captured, $((Get-Item $out).Length) bytes, $($hashes[$page])"
          }
          # Different pages must not produce the same pixels; identical captures mean a
          # blank or stuck window, not rendered pages.
          if (($hashes.Values | Select-Object -Unique).Count -ne $hashes.Count) { throw 'two of the page captures are identical' }
      - name: Verify the generated settings page and new-tab markup
        shell: pwsh
        run: |
          python tests/Psycho_ui_settings_tests.py 2>&1 | Tee-Object build/ui-settings.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=UI markup tests::see build/ui-settings.txt"; exit $LASTEXITCODE }
      - name: Check the settings page wiring and the settings catalog (S088)
        shell: pwsh
        run: |
          python tools/Psycho_gen_settings_catalog.py --check
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Settings catalog::out of date"; exit $LASTEXITCODE }
          python tests/Psycho_ui_settings_wiring_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/ui-settings-wiring.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Settings wiring tests::see build/ui-settings-wiring.txt"; exit $LASTEXITCODE }
      - name: Check the browser frame page's behaviour (S081)
        shell: pwsh
        run: |
          python tests/Psycho_ui_chrome_tests.py --engine build/pv-engine.exe 2>&1 | Tee-Object build/ui-chrome.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Frame page tests::see build/ui-chrome.txt"; exit $LASTEXITCODE }
      - name: Measure my pages against the legacy captures (report only)
        shell: pwsh
        run: |
          # Real glyphs are drawn here, unlike a headless Linux render, so these numbers include text.
          # The limit is the full image so the harness reports a count instead of failing the step.
          $common = @('--engine', 'build/pv-engine.exe', '--max-changed-pixels', '99999999',
                      '--resource', 'psychovault://newtab/tokens.css=ui/tokens.css',
                      '--resource', 'psychovault://newtab/components.css=ui/components.css',
                      '--resource', 'psychovault://newtab/app.js=ui/app.js',
                      '--resource', 'psychovault://settings/tokens.css=ui/tokens.css',
                      '--resource', 'psychovault://settings/components.css=ui/components.css',
                      '--resource', 'psychovault://settings/settings.js=ui/settings.js')
          python tools/Psycho_reference_diff.py --reference 03-new-tab-page.png --input ui/index.html --url psychovault://newtab/ --outdir build/ref-diff-newtab @common 2>&1 | Tee-Object build/ref-diff-newtab.txt
          python tools/Psycho_reference_diff.py --reference 04-settings-general.png --input ui/settings.html --url psychovault://settings/ --outdir build/ref-diff-settings @common 2>&1 | Tee-Object build/ref-diff-settings.txt
          foreach ($name in 'newtab', 'settings') {
            $report = Get-Content "build/ref-diff-$name/report.json" -Raw | ConvertFrom-Json
            Write-Host "legacy-diff $name : $($report | ConvertTo-Json -Compress -Depth 3)"
          }
      - name: Exercise my tab and history models in the running shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE 'build/captures/tabs-smoke.png'
          $report = "$out.tabs.json"
          Remove-Item -Force $report -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\build\PsychoVault.exe' -ArgumentList @('--smoke', '--smoke-tabs', '--capture', $out, '--profile', 'build/tabs-profile') -PassThru
          if (-not $p.WaitForExit(90000)) { try { $p.Kill($true) } catch {}; throw 'the tab model smoke did not finish' }
          if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
          if ($p.ExitCode -ne 0) { throw "the tab model smoke exited $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'the tab model smoke wrote no report' }
          if ((Get-Content $report -Raw | ConvertFrom-Json).result -ne 'passed') { throw 'the tab model smoke did not pass' }
      - name: Drive the engine-rendered browser frame with real pointer input (S081)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE 'build/captures/chrome-smoke.png'
          $report = "$out.chrome.json"
          Remove-Item -Force $report -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\build\PsychoVault.exe' -ArgumentList @('--smoke', '--smoke-chrome', '--capture', $out, '--profile', 'build/chrome-profile') -PassThru
          if (-not $p.WaitForExit(90000)) { try { $p.Kill($true) } catch {}; if (Test-Path $report) { Write-Host (Get-Content $report -Raw) } else { Write-Host 'no report was written before the hang' }; throw 'the chrome smoke did not finish' }
          if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
          if ($p.ExitCode -ne 0) { throw "the chrome smoke exited $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'the chrome smoke wrote no report' }
          if ((Get-Content $report -Raw | ConvertFrom-Json).result -ne 'passed') { throw 'the chrome smoke did not pass' }
      - name: Press a real settings switch and check the saved profile (S088)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE 'build/captures/settings-smoke.png'
          $report = "$out.settings.json"
          Remove-Item -Force $report -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\build\PsychoVault.exe' -ArgumentList @('--smoke', '--smoke-settings', '--capture', $out, '--profile', 'build/settings-profile', 'psychovault://settings') -PassThru
          if (-not $p.WaitForExit(90000)) { try { $p.Kill($true) } catch {}; if (Test-Path $report) { Write-Host (Get-Content $report -Raw) } else { Write-Host 'no report was written before the hang' }; throw 'the settings smoke did not finish' }
          if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
          if ($p.ExitCode -ne 0) { throw "the settings smoke exited $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'the settings smoke wrote no report' }
          if ((Get-Content $report -Raw | ConvertFrom-Json).result -ne 'passed') { throw 'the settings smoke did not pass' }
      - name: Exercise my broker services and renderer crash recovery in the running shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/captures | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE 'build/captures/services-smoke.png'
          $report = "$out.services.json"
          $profile = Join-Path $env:GITHUB_WORKSPACE 'build/services-profile'
          Remove-Item -Recurse -Force $profile -ErrorAction SilentlyContinue
          Remove-Item -Force $report -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\build\PsychoVault.exe' -ArgumentList @('--smoke', '--smoke-services', '--capture', $out, '--profile', $profile) -PassThru
          if (-not $p.WaitForExit(150000)) { try { $p.Kill($true) } catch {}; throw 'the services smoke did not finish' }
          if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
          if (Test-Path "$profile/logs") { Get-ChildItem "$profile/logs" | ForEach-Object { Write-Host "log $($_.Name) $($_.Length) bytes" } }
          if ($p.ExitCode -ne 0) { throw "the services smoke exited $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'the services smoke wrote no report' }
          if ((Get-Content $report -Raw | ConvertFrom-Json).result -ne 'passed') { throw 'the services smoke did not pass' }
      - name: Exercise my app address bridge to a fetched page in one running app
        id: s045_flow
        shell: pwsh
        run: |
          $smokeProfile = Join-Path $env:GITHUB_WORKSPACE 'build/s045-app-flow-profile'
          Remove-Item -Recurse -Force $smokeProfile -ErrorAction SilentlyContinue
          $server = Start-Process python -ArgumentList '-m','http.server','8767','--directory','tests/fixtures' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            New-Item -ItemType Directory -Force build/captures | Out-Null
            $appProcess = Start-Process -FilePath '.\build\PsychoVault.exe' -ArgumentList @('--smoke','--expect-image','--smoke-bridge-url','http://127.0.0.1:8767/Psycho_browser-smoke.html','--capture','build/captures/s045-app-flow.png','--profile',$smokeProfile) -PassThru
            if (-not $appProcess.WaitForExit(120000)) {
              try { $appProcess.Kill($true) } catch {}
              $appProcess.WaitForExit()
              $flowExit = 99
            } else { $flowExit = $appProcess.ExitCode }
            $consoleDetail = "S045 app exit code: $flowExit"
            $consoleDetail | Set-Content build/captures/s045-app-flow-console.txt -Encoding utf8
            Write-Host $consoleDetail
            if ($flowExit -ne 0) {
              $detail = $consoleDetail
              if (Test-Path build/captures/s045-app-flow.png.flow.json) {
                $failedReport = Get-Content build/captures/s045-app-flow.png.flow.json -Raw | ConvertFrom-Json
                $detail += ' ' + ($failedReport | ConvertTo-Json -Compress)
              }
              Write-Host "::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045FlowFailure::$detail"
              throw "S045 same-app bridge smoke exited $flowExit"
            }
            if (-not (Test-Path build/captures/s045-app-flow.png.flow.json)) {
              $detail = $consoleDetail
              Write-Host "::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045FlowReportMissing::$detail"
              throw 'S045 same-app flow report was not written'
            }
            $report = Get-Content build/captures/s045-app-flow.png.flow.json -Raw | ConvertFrom-Json
            $detail = $report | ConvertTo-Json -Compress
            Write-Host "::warning file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045FlowReport::$detail"
            if ($report.result -ne 'passed') { Write-Host "::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045FlowResult::$detail"; throw "S045 same-app flow did not pass: $($report.reason)" }
            if (($report.sourceUrl -ne 'psychovault://newtab' -and $report.sourceUrl -ne 'psychovault://newtab/') -or -not $report.sourceTabRetained -or $report.tabCount -lt 2) { Write-Host "::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045SourceGate::$detail"; throw 'S045 app tab was not retained alongside the fetched page' }
            if ($report.actualUrl -ne 'http://127.0.0.1:8767/Psycho_browser-smoke.html' -or -not $report.targetRendererReady -or $report.targetImageCount -lt 1) { Write-Host "::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045RenderGate::$detail"; throw 'S045 address bridge did not render the expected page and image' }
            if (-not (Test-Path build/captures/s045-app-flow.png.app.png)) { Write-Host '::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045AppCaptureMissing::'; throw 'S045 app-page capture is missing' }
            if (-not (Test-Path build/captures/s045-app-flow.png)) { Write-Host '::error file=.github/workflows/Psycho_owned-engine.yml,line=90,title=S045FixtureCaptureMissing::'; throw 'S045 fetched-page capture is missing' }
            Get-Content build/captures/s045-app-flow.png.flow.json
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

      - name: Prove my single executable launches an isolated renderer child
        shell: pwsh
        run: |
          # The broker re-launches this same executable in a private renderer
          # mode. Copy only PsychoVault.exe and exercise startup/rendering.
          $solo = Join-Path $env:RUNNER_TEMP 'psychovault-solo'
          Remove-Item -Recurse -Force $solo -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $solo | Out-Null
          Copy-Item build/PsychoVault.exe $solo/PsychoVault.exe
          $count = (Get-ChildItem $solo -File).Count
          if ($count -ne 1) { throw "My clean folder has $count files, expected 1" }
          New-Item -ItemType Directory -Force build/captures | Out-Null
          Remove-Item build/captures/standalone.png -ErrorAction SilentlyContinue
          Remove-Item build/captures/standalone.png.failure.json -ErrorAction SilentlyContinue
          $server = Start-Process python -ArgumentList '-m','http.server','8766','--directory','tests/fixtures' -PassThru -WindowStyle Hidden
          $render = 1
          try {
            Start-Sleep -Seconds 2
            # PowerShell does not reliably surface a GUI exit code, so I wait on
            # the process handle and read its real code.
            $p = Start-Process -FilePath "$solo/PsychoVault.exe" -ArgumentList '--smoke','--expect-image','--url','http://127.0.0.1:8766/Psycho_browser-smoke.html','--capture','build/captures/standalone.png','--profile','build/solo-profile' -PassThru
            if ($p.WaitForExit(60000)) { $render = $p.ExitCode } else { $render = 99; try { $p.Kill($true) } catch {} }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          # I print my diagnostics before I decide, and I exit outside try/finally
          # so a finally block can never swallow my failure.
          "## My clean-folder renderer-runtime gate" | Add-Content $env:GITHUB_STEP_SUMMARY
          "render exit=$render" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/captures/standalone.png.failure.json) {
            Write-Host '--- my standalone render failure ---'
            Get-Content build/captures/standalone.png.failure.json | Tee-Object -FilePath build/standalone-failure.json
            Get-Content build/captures/standalone.png.failure.json | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            'no render failure report was written' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "standalone render exit=$render"
          # Job summaries are not readable through the API, but annotations are,
          # so my failure reason is published as an annotation too.
          if ($render -ne 0) {
            $detail = 'no failure report was written'
            if (Test-Path build/captures/standalone.png.failure.json) {
              $detail = (Get-Content build/captures/standalone.png.failure.json -Raw)
            }
            $detail = ($detail -replace "`r", '') -replace "`n", ' '
            Write-Host "::error::SOLO-DIAG exit=$render $detail"
            Write-Host "::error::My shell runtime failed to render a fetched page (exit $render)"
            exit 1
          }
          # A real picture, with only the browser executable in the clean
          # folder: the renderer is a child process mode of that same image.
          python -c "import pathlib,sys; d=pathlib.Path('build/captures/standalone.png').read_bytes(); sys.exit(0 if d[:8]==bytes([137,80,78,71,13,10,26,10]) and len(d)>1000 else 1)"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::My standalone capture is not a real PNG"; exit 1 }
          $after = (Get-ChildItem $solo -File).Count
          if ($after -ne 1) { Write-Host "::error::My browser folder changed to $after files after execution, expected 1"; exit 1 }
          "## My single executable hosted a renderer child" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Package Windows preview ZIP
        shell: pwsh
        run: |
          python tools/Psycho_package.py --outdir build --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove my package and my verifier agree
        shell: pwsh
        run: |
          python tools/Psycho_verify_package.py --outdir build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write failure note
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          "I did not publish a release. This build failed for commit $env:GITHUB_SHA. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content build/FAILURE.txt
          if (Test-Path build/build.log) {
            $tail = Get-Content build/build.log -Tail 120
            $tail | Set-Content build/build-tail.txt
            "## Build failure tail`n`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($line in $tail) { if ($line -match 'error [A-Z]+[0-9]+|warning [A-Z]+[0-9]+|fatal error|build failed:') { Write-Host "::error::$line" } }
          }
      - name: Upload development build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psychovault-development-${{ github.sha }}
          path: |
            build/*.exe
            build/*.zip
            build/*.txt
            build/*.json
            build/*.log
            build/captures/*.png
            build/captures/*.json
            build/captures/*.txt
            build/golden-results/*.png
            build/golden-results/report.json
            build/independent-golden-results/*.png
            build/independent-golden-results/report.json
          if-no-files-found: warn
          retention-days: 14
