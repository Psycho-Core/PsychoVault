name: Build Android preview APK

on:
  push:
    branches:
      - arena/ce33705b-psychovault
    paths:
      - 'android-port/**'
      - 'app/ui/icon.png'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Audit and build Android debug preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-port
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK and install platform
        run: |
          test -n "${ANDROID_HOME:-}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run source tests
        run: npm test
      - name: Sync Capacitor assets
        run: npm run sync
      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug
        working-directory: android-port/android
      - name: Inspect APK and verify signing
        id: verify
        run: |
          set -eu
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -20
          sha256sum "$apk" > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Write build notes
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p build-notes
          {
            echo 'PsychoVault Android experimental debug build'
            echo "Job status before notes: $BUILD_STATUS"
            echo "Run: $RUN_URL"
            echo 'This is not a release. Proton VPN, extensions and private browsing do not work.'
            echo 'No device or network protection tests are performed by this workflow.'
            if [ -f android/app/build/outputs/apk/debug/SHA256SUMS.txt ]; then
              cat android/app/build/outputs/apk/debug/SHA256SUMS.txt
            else
              echo 'No verified APK checksum was generated. Read the first failing step in the Actions log.'
            fi
          } > build-notes/Release-Notes-Android.txt
      - name: Upload build notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-build-notes
          path: android-port/build-notes/Release-Notes-Android.txt
          if-no-files-found: warn
      - name: Upload verified debug APK
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: psychovault-android-debug-preview
          path: |
            android-port/android/app/build/outputs/apk/debug/app-debug.apk
            android-port/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
