name: Plan audit

on:
  push:
    branches: [Master]
    paths:
      - 'PSYCHO.md'
      - 'README.md'
      - 'docs/**'
      - 'tools/audit-plan.py'
      - '.github/workflows/plan-audit.yml'
  pull_request:
    branches: [Master]
    paths:
      - 'PSYCHO.md'
      - 'README.md'
      - 'docs/**'
      - 'tools/audit-plan.py'
      - '.github/workflows/plan-audit.yml'

permissions:
  contents: read

concurrency:
  group: psychovault-plan-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit owned-browser plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Audit plan and reference evidence
        run: python3 tools/audit-plan.py
