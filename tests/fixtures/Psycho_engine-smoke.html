<!doctype html>
<html><head><meta charset="utf-8"><title>Owned engine smoke</title>
<style>
body{background:#070b12;color:#e6edf3;font-family:Segoe UI;font-size:16px;margin:0;padding:32px}
h1{color:#38bdf8;margin:0 0 12px;font-size:32px}
.card{background:#101826;border:1px solid #263449;padding:20px;margin:16px 0;max-width:640px}
button{background:#0ea5e9;color:#041018;border:0;padding:10px 18px;font-weight:bold}
a{color:#7dd3fc}
</style></head>
<body><h1 id="title">PsychoVault</h1><p>This page is parsed, styled, scripted and painted by my own engine.</p>
<div class="card"><p id="count">Waiting for JavaScript.</p><button id="go">Run DOM update</button><p><a href="https://example.com/">A real link target</a></p></div>
<script>
var clicks=0;
var button=document.getElementById('go');
button.addEventListener('click',function(){clicks=clicks+1;document.getElementById('count').textContent='DOM updated '+clicks+' time(s).';});
document.getElementById('count').textContent='JavaScript executed before paint.';
var items=[1,2,3].map(function(x){return x*2;});
document.title='Owned engine smoke '+items.join(',');
</script></body></html>
