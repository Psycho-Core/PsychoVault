<!doctype html>
<title>P2 contract: image fit and box</title>
<style>
html, body { margin: 0; background: #ffffff; }
img { display: block; width: 80px; height: 40px; border: 2px solid #334155; background: #eeeeee; }
#contain { object-fit: contain; }
#cover { object-fit: cover; }
#none { object-fit: none; }
#down { object-fit: scale-down; }
</style>
<img id="contain" src="https://s050.test/pixel.png" alt="contain">
<img id="cover" src="https://s050.test/pixel.png" alt="cover">
<img id="none" src="https://s050.test/pixel.png" alt="none">
<img id="down" src="https://s050.test/pixel.png" alt="down">
<img id="fill" src="https://s050.test/pixel.png" alt="fill">
