<!doctype html>
<html><head><title>P2 contract: intrinsic blockified images</title><style>
html, body { margin: 0; padding: 0; }
.row { width: 100px; height: 24px; }
.flex { display: flex; align-items: flex-start; }
.stretch { align-items: stretch; }
.grid { display: grid; grid-template-columns: 100px; grid-template-rows: 24px; }
.positioned { position: relative; }
.wide { width: 20px; }
.tall { height: 10px; }
.absolute { position: absolute; left: 10px; top: 4px; }
</style></head><body>
<div class="row flex"><img class="wide" src="pixel.png"></div>
<div class="row flex"><img class="tall" src="pixel.png"></div>
<div class="row grid"><img width="14" src="pixel.png"></div>
<div class="row positioned"><img class="absolute" src="pixel.png"></div>
<div class="row flex"><img srcset="pixel.png 2x"></div>
<div class="row flex stretch"><img class="wide" src="pixel.png"></div>
</body></html>
