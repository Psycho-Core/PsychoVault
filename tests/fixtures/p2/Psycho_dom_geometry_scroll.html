<!doctype html>
<style>
body { margin:0; height:900px; }
#probe { position:absolute; left:30px; top:200px; width:80px; height:40px; }
#fixed { position:fixed; left:10px; top:10px; width:50px; height:20px; }
#scrollport { position:absolute; left:140px; top:140px; width:100px; height:60px; overflow:auto; }
#child { height:300px; }
#measure { position:fixed; left:70px; top:0; width:30px; height:20px; }
#results { display:none; }
</style>
<div id="probe"></div><div id="fixed"></div>
<div id="scrollport"><div id="child"></div></div>
<button id="measure">go</button><div id="results"></div>
<script>
document.getElementById('measure').addEventListener('click', function () {
  var a = document.getElementById('probe').getBoundingClientRect();
  var b = document.getElementById('fixed').getBoundingClientRect();
  var c = document.getElementById('child').getBoundingClientRect();
  document.getElementById('results').textContent = [a.x,a.y,a.width,a.height,b.x,b.y,b.width,b.height,c.x,c.y].join('|');
});
</script>
